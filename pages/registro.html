<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changuito · Crear cuenta</title>
</head>
<body>
  <header>
    <a href="../index.html">Changuito</a>
    <form action="explorar.html" method="get" role="search">
      <label for="buscar">Buscar productos</label>
      <input type="search" id="buscar" name="q" placeholder="Buscar productos…">
      <button type="submit">Buscar</button>
    </form>
    <nav aria-label="Principal">
      <ul>
        <li><a href="explorar.html">Explorar</a></li>
        <li><a href="mi-lista.html">Mi lista (7)</a></li>
        <li><a href="mis-pedidos.html">Mis pedidos</a></li>
        <li><a href="perfil.html"><img src="../assets/img/placeholder.svg" alt="" width="32" height="32"> María Clara</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section aria-labelledby="registro-titulo">
      <h1 id="registro-titulo">Crear cuenta</h1>
      <form action="../index.html" method="post">
        <p>
          <label for="nombre">Nombre y apellido</label>
          <input type="text" id="nombre" name="nombre" placeholder="María Clara" autocomplete="name" required>
        </p>
        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
        </p>
        <p>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        </p>
        <p>
          <label for="direccion">Dirección de entrega</label>
          <input type="text" id="direccion" name="direccion" placeholder="Calle, número, localidad" autocomplete="address-line1" required>
        </p>
        <p>
          <input type="checkbox" id="terminos" name="terminos" required>
          <label for="terminos">Acepto <a href="#">términos y condiciones</a></label>
        </p>
        <button type="submit">Crear cuenta</button>
      </form>
      <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </section>
  </main>

  <footer>
    <p>Changuito</p>
    <p>Comprá mejor, viví tranquilo</p>
    <nav aria-label="Institucional">
      <ul>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Contacto</a></li>
        <li><a href="#">Privacidad</a></li>
        <li><a href="#">Términos</a></li>
      </ul>
    </nav>
    <p><small>© 2026 Changuito</small></p>
  </footer>

  <nav aria-label="Navegación inferior">
    <ul>
      <li><a href="explorar.html">Explorar</a></li>
      <li><a href="mi-lista.html">Mi lista</a></li>
      <li><a href="mis-pedidos.html">Pedidos</a></li>
      <li><a href="perfil.html">Perfil</a></li>
    </ul>
  </nav>
</body>
</html>
